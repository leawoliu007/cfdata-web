name: Go Build Multi-Arch

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Download Dependencies
      run: go mod download

    - name: Build Binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: 0
      run: |
        OUTPUT_NAME=cfdata-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi
        if [ "${{ matrix.goarch }}" = "arm" ] && [ -n "${{ matrix.goarm }}" ]; then
          OUTPUT_NAME=cfdata-${{ matrix.goos }}-${{ matrix.goarch }}v${{ matrix.goarm }}
        fi
        
        echo "Building ${OUTPUT_NAME}..."
        go build -trimpath -ldflags="-s -w" -o dist/${OUTPUT_NAME} cfdata.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cfdata-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
        path: dist/*
